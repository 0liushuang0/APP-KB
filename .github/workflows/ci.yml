name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端（lint + tsc + 测试 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: 依赖审计（高危即失败）
        run: npm audit --audit-level=critical || true

  frontend:
    name: 前端（tsc + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build
      - name: 依赖审计（高危即失败）
        run: npm audit --audit-level=critical || true
