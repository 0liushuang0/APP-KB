version: '3.8'

# 内网团队部署：先运行 scripts/setup-team.ps1，再用 --env-file deploy/team.env 启动。
# 包含：前端(Nginx) + 后端(NestJS) + AI服务(FastAPI) + PostgreSQL + Redis

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 数据库
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aikb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?先运行 scripts/setup-team.ps1 生成 deploy/team.env}
      POSTGRES_DB: ${DB_NAME:-aikb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikb-net

  # ──────────────────────────────────────────────
  # Redis 缓存 + 任务队列
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aikb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikb-net

  # ──────────────────────────────────────────────
  # AI 服务 (Python FastAPI)
  # ──────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aikb-ai
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      API_KEY: ${AI_SERVICE_API_KEY:?缺少 AI_SERVICE_API_KEY}
      DATA_DIR: /app/data
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-basic}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-glm-4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo}
      EGRESS_MODE: ${EGRESS_MODE:-cloud}
      EGRESS_SANITIZE: ${EGRESS_SANITIZE:-true}
      # Ollama 本地模型（可选）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    volumes:
      - ai_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $${API_KEY}\" http://localhost:8000/health/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aikb-net

  # ──────────────────────────────────────────────
  # 后端 API (NestJS)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aikb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_MODE: team
      DB_TYPE: postgres
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?缺少 DB_PASSWORD}@postgres:5432/${DB_NAME:-aikb}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?缺少 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-aikb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?缺少 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?缺少 AI_SERVICE_API_KEY}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?缺少 DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NICKNAME: ${DEFAULT_ADMIN_NICKNAME:-System Admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@aikb.local}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-}
      FILE_ENCRYPTION_ENABLED: ${FILE_ENCRYPTION_ENABLED:-false}
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-true}
      AUTO_BACKUP_INTERVAL_HOURS: ${AUTO_BACKUP_INTERVAL_HOURS:-6}
      AUTO_BACKUP_KEEP_COUNT: ${AUTO_BACKUP_KEEP_COUNT:-7}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?缺少 PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/system/info"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aikb-net

  # ──────────────────────────────────────────────
  # 前端 (Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aikb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/aikb-server.crt:/etc/nginx/tls/aikb-server.crt:ro
      - ./deploy/tls/aikb-server.key:/etc/nginx/tls/aikb-server.key:ro
    networks:
      - aikb-net

volumes:
  postgres_data:
  redis_data:
  ai_data:
  backend_data:

networks:
  aikb-net:
    driver: bridge
